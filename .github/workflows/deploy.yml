name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install, build, and upload site
        uses: withastro/action@v6
        env:
          # Preview at https://matt-ortiz.github.io/babyblue-catering/ (noindexed).
          # At launch on babybluecatering.com, delete these two lines so the
          # build uses the production defaults in astro.config.mjs.
          SITE_URL: https://matt-ortiz.github.io
          BASE_PATH: /babyblue-catering

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
